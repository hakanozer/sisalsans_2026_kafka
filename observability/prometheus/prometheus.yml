global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: order
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order:8090"]

  - job_name: consumer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["consumer:8095"]

  - job_name: kafka-broker
    static_configs:
      - targets: ["jmx-exporter:9404"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
